name: 🩺 Diagnose & Repair (Hetzner)

# Manual + auto workflow that SSHes to the live Hetzner host, prints a short
# diagnostic report, nuclear-reclaims the canonical PM2 stack, reloads nginx,
# and runs smoke tests. Designed to finish well under the job timeout so a
# hung wait_for_health loop can never cancel mid-heal again.

on:
  workflow_dispatch:
    inputs:
      do_repair:
        description: 'Run self-heal actions (pm2 restart, nginx reload, pm2 save). If false, only diagnose.'
        type: boolean
        default: true
  # Auto-heal when Stable Deploy fails — production is typically on the nginx
  # maintenance page at that point and needs a hard PM2 reclaim without waiting
  # for a human to click "Run workflow".
  workflow_run:
    workflows: ["🚀 Unicorn Stable Deploy"]
    types: [completed]

concurrency:
  group: zeusai-diagnose-repair
  cancel-in-progress: false

jobs:
  diagnose-and-repair:
    # workflow_dispatch → always. workflow_run → only after a FAILED Stable Deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    # Heal is nuclear + bounded (~3–6 min). 20m leaves headroom for SSH/smoke.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap SSH access
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST:            ${{ secrets.HETZNER_HOST }}
        run: |
          chmod +x UNICORN_FINAL/scripts/ensure-ssh-access.sh
          bash UNICORN_FINAL/scripts/ensure-ssh-access.sh

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Add Hetzner host to known_hosts
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Diagnostic report
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          SSH=(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes)

          echo "::group::PM2 list"
          "${SSH[@]}" root@"$HETZNER_HOST" 'timeout 20s pm2 list || echo "[pm2] not available"' || true
          echo "::endgroup::"

          echo "::group::Listening ports (3000 / 3001 / 80 / 443)"
          "${SSH[@]}" root@"$HETZNER_HOST" "ss -tlnp 2>/dev/null | grep -E ':3000|:3001|:80|:443' || echo '[ss] no matches'" || true
          echo "::endgroup::"

          echo "::group::Nginx config test"
          "${SSH[@]}" root@"$HETZNER_HOST" 'timeout 15s nginx -t 2>&1 || echo "[nginx] -t failed"' || true
          echo "::endgroup::"

          echo "::group::PM2 last 40 log lines (canonical apps)"
          "${SSH[@]}" root@"$HETZNER_HOST" 'timeout 20s pm2 logs unicorn-backend unicorn-site --lines 40 --nostream 2>&1 || echo "[pm2 logs] not available"' || true
          echo "::endgroup::"

          echo "::group::Backend-direct probes (127.0.0.1:3000)"
          "${SSH[@]}" root@"$HETZNER_HOST" bash -s <<'SSHEOF' || true
            for ep in /health/live /api/health /health; do
              code=$(curl -sS -o /dev/null -m 3 -w '%{http_code}' "http://127.0.0.1:3000${ep}" || echo "000")
              printf '  %-22s -> %s\n' "$ep" "$code"
            done
            for ep in /health/live /health; do
              code=$(curl -sS -o /dev/null -m 3 -w '%{http_code}' "http://127.0.0.1:3001${ep}" || echo "000")
              printf '  site%-18s -> %s\n' "$ep" "$code"
            done
          SSHEOF
          echo "::endgroup::"

      - name: Self-heal (nuclear PM2 reclaim + nginx restart)
        # workflow_dispatch respects the do_repair input; auto-runs after a
        # failed Stable Deploy always repair (that is the whole point).
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.do_repair == true }}
        timeout-minutes: 10
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # Hard outer bound (540s < the 10m step budget): even if the SSH
          # stream stalls mid-heal despite ServerAlive*, `timeout` reaps it so
          # this step can NEVER hang forever. Non-zero from the bound is logged
          # but not fatal, so the smoke step still runs and surfaces the truth.
          timeout --signal=KILL 540s \
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes root@"$HETZNER_HOST" bash -s <<'SSHEOF' || echo "[heal] self-heal SSH ended (rc=$? — hard-bounded, continuing to smoke)"
            set +e
            rm -f /etc/zeus-autodeploy.disabled /etc/zeus-healer.disabled

            APP_DIR=""
            # Prefer the live symlink target (current/live) over a stale flat copy.
            for candidate in \
              /var/www/unicorn/current/UNICORN_FINAL \
              /var/www/unicorn/live/UNICORN_FINAL \
              /var/www/unicorn/UNICORN_FINAL
            do
              if [ -f "$candidate/ecosystem.config.js" ]; then
                APP_DIR="$(readlink -f "$candidate" 2>/dev/null || echo "$candidate")"
                break
              fi
            done
            if [ -z "$APP_DIR" ]; then
              echo '[heal] FATAL: ecosystem.config.js missing'
              exit 1
            fi
            echo "[heal] APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            echo "[heal] git HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

            echo '[heal] hard reset PM2 daemon/dump'
            timeout 10s pm2 stop all 2>/dev/null || true
            timeout 10s pm2 delete all 2>/dev/null || true
            timeout 8s pm2 kill 2>/dev/null || true
            pkill -9 -f 'PM2 v.*God Daemon' 2>/dev/null || true
            pkill -9 -f 'rescue-backend\.js' 2>/dev/null || true
            pkill -9 -f 'node .*backend/index\.js' 2>/dev/null || true
            pkill -9 -f 'node .*src/index\.js' 2>/dev/null || true
            rm -f /root/.pm2/dump.pm2 /root/.pm2/dump.pm2.bak /root/.pm2/rpc.sock /root/.pm2/pub.sock /root/.pm2/pm2.pid 2>/dev/null || true
            rm -rf /root/.pm2/pids/* 2>/dev/null || true
            for PORT in 3000 3001 3100; do
              PIDS=$(ss -tlnp 2>/dev/null | awk -v p=":$PORT" '$4 ~ p {print $0}' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)
              for PID in $PIDS; do
                [ -n "$PID" ] || continue
                echo "[heal] killing stale listener pid=$PID on port $PORT"
                kill -9 "$PID" 2>/dev/null || true
              done
            done
            sleep 2

            export NODE_ENV=production
            export BIND_HOST=127.0.0.1
            export UNICORN_RUNTIME_PROFILE=stable
            export DISABLE_SELF_MUTATION=1
            export QIS_AUTO_HEAL_ENABLED=false
            export SITE_INSTANCES="${SITE_INSTANCES:-1}"
            export UNICORN_INSTANCES="${UNICORN_INSTANCES:-1}"
            export UNICORN_GUARDIAN=0

            echo '[heal] pm2 start canonical stack'
            timeout 60s pm2 start ecosystem.config.js --only unicorn-backend,unicorn-site,autoscaler --update-env 2>&1 \
              || echo '[heal] pm2 start failed'

            wait_for_live() {
              local name="$1"
              local url="$2"
              local attempts="${3:-12}"
              local delay="${4:-3}"
              local i=1
              while [ "$i" -le "$attempts" ]; do
                if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
                  echo "[heal] $name live after attempt $i/$attempts"
                  return 0
                fi
                if [ "$i" -eq 1 ] || [ "$((i % 3))" -eq 0 ]; then
                  echo "[heal] waiting for $name ($i/$attempts)"
                fi
                sleep "$delay"
                i="$((i + 1))"
              done
              echo "[heal] $name still unhealthy after $attempts attempts"
              return 1
            }

            # Prefer /health/live (process-only) so a busy event loop does not
            # look like a dead process during warm-up.
            dump_backend_diag() {
              echo '::group::Backend boot diagnostics'
              timeout 15s pm2 describe unicorn-backend 2>&1 | tail -80 || true
              timeout 15s pm2 logs unicorn-backend --err --lines 100 --nostream 2>&1 | tail -120 || true
              timeout 15s pm2 logs unicorn-backend --out --lines 60 --nostream 2>&1 | tail -80 || true
              ss -tlnp 2>/dev/null | grep -E ':3000|:3001' || echo '[ss] no 3000/3001 listeners'
              echo '::endgroup::'
            }

            # SIGKILL a PM2-online but non-serving backend (accept-but-hang / stuck boot).
            force_kill_backend() {
              echo '[heal] SIGKILL unicorn-backend (stuck boot / hang)'
              local pid
              pid="$(pm2 jlist 2>/dev/null | node -e '
                let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
                  try {
                    const apps=JSON.parse(s||"[]");
                    const a=apps.find(x=>x&&x.name==="unicorn-backend");
                    const p=a&&a.pid; if (p) process.stdout.write(String(p));
                  } catch (_) {}
                });
              ' 2>/dev/null || true)"
              if [ -n "${pid:-}" ]; then kill -9 "$pid" 2>/dev/null || true; fi
              timeout 15s pm2 delete unicorn-backend 2>/dev/null || true
              for PORT in 3000; do
                PIDS=$(ss -tlnp 2>/dev/null | awk -v p=":$PORT" '$4 ~ p {print $0}' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | sort -u)
                for PID in $PIDS; do kill -9 "$PID" 2>/dev/null || true; done
              done
            }

            BACKEND_HEALTHY=0
            SITE_HEALTHY=0
            # Backend cold boot can exceed 36s under world-catalog work; allow ~80s.
            wait_for_live backend http://127.0.0.1:3000/health/live 20 4 && BACKEND_HEALTHY=1
            wait_for_live site http://127.0.0.1:3001/health/live 12 3 && SITE_HEALTHY=1

            if [ "$BACKEND_HEALTHY" != "1" ]; then
              echo '[heal] backend retry (canonical only — never rescue)'
              dump_backend_diag
              force_kill_backend
              timeout 60s pm2 start ecosystem.config.js --only unicorn-backend --update-env 2>&1 || true
              wait_for_live backend http://127.0.0.1:3000/health/live 20 4 && BACKEND_HEALTHY=1
              if [ "$BACKEND_HEALTHY" != "1" ]; then
                dump_backend_diag
              fi
            fi

            if [ "$SITE_HEALTHY" != "1" ]; then
              echo '[heal] site retry'
              timeout 15s pm2 delete unicorn-site 2>/dev/null || true
              timeout 60s pm2 start ecosystem.config.js --only unicorn-site --update-env 2>&1 || true
              wait_for_live site http://127.0.0.1:3001/health/live 10 3 && SITE_HEALTHY=1
            fi

            if pm2 jlist 2>/dev/null | grep -q 'rescue-backend\.js'; then
              echo '[heal] ERROR: rescue-backend.js in PM2 — purging'
              pkill -9 -f 'rescue-backend\.js' 2>/dev/null || true
              timeout 15s pm2 delete unicorn-backend 2>/dev/null || true
              timeout 60s pm2 start ecosystem.config.js --only unicorn-backend --update-env 2>&1 || true
            fi

            echo '[heal] nginx -t && systemctl restart nginx'
            if timeout 15s nginx -t 2>&1; then
              systemctl restart nginx 2>&1 || systemctl reload nginx 2>&1 || echo '[heal] nginx restart failed'
            else
              echo '[heal] nginx config invalid — skipping reload'
            fi

            echo '[heal] pm2 save'
            timeout 15s pm2 save --force 2>&1 || echo '[heal] pm2 save failed'

            # Short settle only — do not burn the job timeout waiting.
            sleep 5
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/health || \
              curl -fsS --max-time 3 http://127.0.0.1:3000/health/live || true
            echo
            curl -fsS --max-time 5 http://127.0.0.1:3001/health || \
              curl -fsS --max-time 3 http://127.0.0.1:3001/health/live || true
            echo
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health 2>/dev/null | grep -Eq '"mode"[[:space:]]*:[[:space:]]*"rescue"|zeus-rescue-api'; then
              echo '[heal] FATAL: backend still identifies as rescue — last purge'
              pkill -9 -f 'rescue-backend\.js' 2>/dev/null || true
              timeout 15s pm2 delete unicorn-backend 2>/dev/null || true
              timeout 60s pm2 start ecosystem.config.js --only unicorn-backend --update-env 2>&1 || true
            fi
            timeout 15s pm2 list || true
            echo "[heal] done backend_live=$BACKEND_HEALTHY site_live=$SITE_HEALTHY"
          SSHEOF

      - name: Smoke tests (backend-direct, then nginx)
        timeout-minutes: 5
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          chmod +x UNICORN_FINAL/scripts/smoke-forward-only.sh

          echo "::group::Smoke (backend-direct via SSH on 127.0.0.1:3000)"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes root@"$HETZNER_HOST" \
            'cd /var/www/unicorn/current/UNICORN_FINAL 2>/dev/null || cd /var/www/unicorn/UNICORN_FINAL; BASE_URL=http://127.0.0.1:3000 SKIP_PUBLIC=1 REQUIRE_PM2=1 AUTOSTART_LOCAL=0 bash scripts/smoke-forward-only.sh'
          echo "[backend-direct] PASS"
          echo "::endgroup::"

          echo "::group::Smoke (public via nginx)"
          GITHUB_SHA="" BASE_URL="http://$HETZNER_HOST" PUBLIC_URL="https://zeusai.pro" \
            bash UNICORN_FINAL/scripts/smoke-forward-only.sh
          echo "[public] PASS"
          echo "::endgroup::"

      - name: Final summary
        if: always()
        run: |
          echo "Diagnostic & repair pass complete."
          echo "If smoke still failing: inspect the 'Diagnostic report' group above for PM2/nginx/log details."
