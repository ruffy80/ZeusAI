          pm2 jlist | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(p.get("pm_id"), p.get("name"), p.get("pm2_env",{}).get("status")) for p in d if p.get("name") in ["unicorn-backend","unicorn-site","autoscaler","module-mesh-guardian","unicorn-live-sync","unicorn-guardian"]]' || true
