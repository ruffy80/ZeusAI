name: 🚀 Unicorn Stable Deploy

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main" ]
    paths:
      - 'UNICORN_FINAL/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/no-downgrade-guard.yml'
      - '.github/baselines/**'
      - 'VERSION_LOCK'

concurrency:
  group: unicorn-stable-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-deprecation
    # Hard ceiling so a hung step (e.g. an interval that forgets process.exit)
    # cannot burn 6h of CI again the way it did 2026-04-29 (8 cancelled runs
    # in a row → live PM2 stack drifted → 502 outage). The job normally
    # completes in ~7-9 minutes; 30 minutes is generous headroom.
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔐 Required deploy secrets gate
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          miss=0
          for k in HETZNER_HOST HETZNER_SSH_PRIVATE_KEY; do
            v="${!k:-}"
            if [ -z "$v" ]; then
              echo "::error::Missing required secret: $k"
              miss=1
            fi
          done
          if [ "$miss" -ne 0 ]; then
            echo "::error::Autodeploy blocked: required Hetzner secrets are not fully configured."
            exit 1
          fi
          echo "✅ required deploy secrets present"

      - name: 🌐 SSH reachability preflight (retry)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_DEPLOY_PORT: ${{ secrets.HETZNER_DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            if timeout 15s bash -c "</dev/tcp/${HETZNER_HOST}/${HETZNER_DEPLOY_PORT}" 2>/dev/null; then
              echo "✅ ssh port reachable on attempt $i"
              ok=1
              break
            fi
            echo "⚠️ ssh port not reachable (attempt $i/5), retrying..."
            sleep $((i*2))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Hetzner SSH endpoint not reachable after retries (${HETZNER_HOST}:${HETZNER_DEPLOY_PORT})"
            exit 1
          fi

      # ── No-downgrade pre-flight ──────────────────────────────────────────
      # HARD GATE: this step must pass or no SSH/rsync ever happens.
      # The pinned SHA in .github/baselines/live.sha is the last snapshot
      # confirmed live by both deploy.yml and global-health.yml.  Any HEAD
      # that is not a strict descendant of that SHA is refused.
      # See LIVE_BASELINE.md for the full contract.
      - name: 🛡️ No-downgrade pre-flight (refuse rollback before SSH)
        run: |
          set -euo pipefail
          if [ ! -f .github/baselines/live.sha ]; then
            echo "::error::.github/baselines/live.sha is missing — refusing to deploy"
            exit 1
          fi
          BASELINE="$(tr -d '[:space:]' < .github/baselines/live.sha)"
          if [ "${#BASELINE}" -lt 40 ]; then
            echo "::error::.github/baselines/live.sha is not a full 40-char SHA"
            exit 1
          fi
          if ! git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=0 origin "+${BASELINE}:refs/baseline/live" || true
          fi
          git cat-file -e "${BASELINE}^{commit}"
          if [ "${GITHUB_SHA}" = "${BASELINE}" ]; then
            echo "✅ HEAD == pinned baseline (re-deploy of last-known-good)"
          elif git merge-base --is-ancestor "${BASELINE}" "${GITHUB_SHA}"; then
            echo "✅ HEAD ${GITHUB_SHA} is descendant of pinned baseline ${BASELINE}"
          else
            echo "::error::HEAD ${GITHUB_SHA} is NOT a descendant of pinned baseline ${BASELINE}"
            echo "::error::This deploy would be a downgrade.  Refusing to ssh-rsync."
            exit 1
          fi

      # ── AutoInnovation deploy gate ───────────────────────────────────────
      # Independent layer: even if a bot manages to merge an `[AutoInnovation]`
      # commit to main (e.g. via a PAT that bypasses status checks), this
      # step refuses to deploy it until a human adds the [innovation-approved]
      # trailer. See LIVE_BASELINE.md and no-downgrade-guard.yml for the
      # matching CI-level check.
      - name: 🤖 AutoInnovation deploy gate
        run: |
          set -euo pipefail
          BASELINE="$(tr -d '[:space:]' < .github/baselines/live.sha)"
          APPROVED_SHA_FILE=".github/baselines/innovation-approved-shas.txt"
          if ! git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=0 origin "+${BASELINE}:refs/baseline/live" || true
          fi

          is_approved_by_sha_file() {
            local sha_lc
            sha_lc="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            [ -f "$APPROVED_SHA_FILE" ] || return 1
            grep -Eiq "^${sha_lc}([[:space:]]*(#.*)?)?$" "$APPROVED_SHA_FILE"
          }

          UNAPPROVED=""
          while IFS= read -r SHA; do
            [ -z "$SHA" ] && continue
            SUBJECT="$(git log -1 --format=%s "$SHA")"
            BODY="$(git log -1 --format=%B "$SHA")"
            case "$SUBJECT" in
              \[AutoInnovation\]*|*\[AutoInnovation\]*)
                if printf '%s' "$BODY" | grep -qiF '[innovation-approved]'; then
                  echo "✅ approved AutoInnovation commit: $SHA — $SUBJECT"
                elif is_approved_by_sha_file "$SHA"; then
                  echo "✅ approved AutoInnovation commit via allowlist: $SHA — $SUBJECT"
                else
                  UNAPPROVED="${UNAPPROVED}${SHA} ${SUBJECT}"$'\n'
                fi
                ;;
            esac
          done < <(git rev-list "${BASELINE}..${GITHUB_SHA}" 2>/dev/null || true)
          if [ -n "$UNAPPROVED" ]; then
            echo "::error::Refusing to deploy: unreviewed AutoInnovation commits since baseline:"
            printf '%s' "$UNAPPROVED" | while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              echo "::error::  $LINE"
            done
            echo "::error::Amend each commit body to include [innovation-approved]"
            echo "::error::or add the exact SHA to ${APPROVED_SHA_FILE} after manual review."
            echo "::error::after a manual review, then re-run the deploy."
            exit 1
          fi
          echo "✅ no unreviewed AutoInnovation commits between baseline and HEAD"

      # ── VERSION_LOCK consistency gate (additive forward-only) ────────────
      # If repo root contains a VERSION_LOCK file, its STABLE_SHA must equal
      # the pinned .github/baselines/live.sha (mirror) OR be one of HEAD's
      # ancestors. This is a redundant check that makes the contract visible
      # in the repo root for human reviewers and external auditors.
      - name: 📌 VERSION_LOCK consistency
        run: |
          set -euo pipefail
          if [ ! -f VERSION_LOCK ]; then
            echo "ℹ️  VERSION_LOCK absent — skipping (non-fatal, gate is satisfied by .github/baselines/live.sha)"
            exit 0
          fi
          LOCK_SHA="$(grep -E '^STABLE_SHA=' VERSION_LOCK | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          MIRROR_SHA="$(tr -d '[:space:]' < .github/baselines/live.sha)"
          if [ -z "${LOCK_SHA}" ] || [ "${#LOCK_SHA}" -lt 40 ]; then
            echo "::error::VERSION_LOCK STABLE_SHA missing or too short"
            exit 1
          fi
          if [ "${LOCK_SHA}" = "${MIRROR_SHA}" ]; then
            echo "✅ VERSION_LOCK matches .github/baselines/live.sha (${LOCK_SHA})"
          else
            # Allow VERSION_LOCK to lag behind mirror so auto-baseline-advance
            # bumps don't have to dual-update; but require that VERSION_LOCK
            # is itself an ancestor of HEAD (i.e. no rollback hidden in it).
            if ! git cat-file -e "${LOCK_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=0 origin "+${LOCK_SHA}:refs/version-lock" || true
            fi
            if ! git merge-base --is-ancestor "${LOCK_SHA}" "${GITHUB_SHA}"; then
              echo "::error::VERSION_LOCK STABLE_SHA ${LOCK_SHA} is NOT an ancestor of HEAD ${GITHUB_SHA}"
              echo "::error::This would be a hidden downgrade. Refusing to deploy."
              exit 1
            fi
            echo "✅ VERSION_LOCK ${LOCK_SHA} is ancestor of HEAD ${GITHUB_SHA} (mirror=${MIRROR_SHA})"
          fi

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            UNICORN_FINAL/package-lock.json
            UNICORN_FINAL/client/package-lock.json

      - name: 🔍 Run Linter (ESLint)
        working-directory: ./UNICORN_FINAL
        timeout-minutes: 10
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run lint

      - name: 🛠️ Test UNICORN_FINAL
        working-directory: ./UNICORN_FINAL
        # Hard timeout so a hung test (e.g. one that forgets process.exit
        # while production modules keep intervals alive) fails fast instead
        # of consuming the full 6h GitHub Actions ceiling and silently
        # blocking deploys, the way it did on 2026-04-29.
        timeout-minutes: 12
        run: npm test --if-present

      - name: 🧬 Forward-only preflight (syntax, requires, routes, PM2 contract)
        working-directory: ./UNICORN_FINAL
        timeout-minutes: 8
        run: npm run preflight:forward

      - name: 🏗️ Build React client UI
        working-directory: ./UNICORN_FINAL/client
        # CI=false: react-scripts treats warnings as errors when CI=true (GitHub Actions default).
        # Keep CI=false for the same warning behavior in local and CI builds.
        run: |
          # Tolerate orphaned npm install racing on node_modules (e.g. from ui-auto-builder
          # GODMODE loop loaded by the previous test step). npm ci itself wipes node_modules,
          # so the explicit rm is best-effort only.
          rm -rf node_modules || true
          npm ci --no-audit --no-fund --loglevel=error || (sleep 3 && rm -rf node_modules || true && npm ci --no-audit --no-fund --loglevel=error)
          NODE_OPTIONS=--no-deprecation CI=false npm run build

      - name: 🔐 Export configured optional secrets for env generation
        env:
          OPTIONAL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const secrets = JSON.parse(process.env.OPTIONAL_SECRETS_JSON || '{}');
          const allow = [
            'JWT_SECRET','ADMIN_SECRET','ADMIN_MASTER_PASSWORD','ADMIN_2FA_CODE','WEBHOOK_SECRET','HETZNER_WEBHOOK_SECRET',
            'GH_PAT','OPENAI_API_KEY','DEEPSEEK_API_KEY','ANTHROPIC_API_KEY','GEMINI_API_KEY','MISTRAL_API_KEY','COHERE_API_KEY',
            'XAI_API_KEY','GROQ_API_KEY','OPENROUTER_API_KEY','HF_API_KEY','HUGGINGFACE_API_KEY','PERPLEXITY_API_KEY','TOGETHER_API_KEY',
            'FIREWORKS_API_KEY','SAMBANOVA_API_KEY','NVIDIA_NIM_API_KEY','STRIPE_SECRET_KEY','STRIPE_PUBLISHABLE_KEY','STRIPE_WEBHOOK_SECRET',
            'STRIPE_PRICE_STARTER_MONTHLY','STRIPE_PRICE_STARTER_YEARLY','STRIPE_PRICE_PRO_MONTHLY','STRIPE_PRICE_PRO_YEARLY',
            'STRIPE_PRICE_ENTERPRISE_MONTHLY','STRIPE_PRICE_ENTERPRISE_YEARLY','PAYPAL_CLIENT_ID','PAYPAL_CLIENT_SECRET','PAYPAL_WEBHOOK_ID','PAYPAL_ENV',
            // NOWPayments — #1 owner-armed revenue unlock (activation impact 100):
            // card/bank/300+ coin checkout that auto-settles to BTC. Optional; the
            // platform still runs BTC-direct without it. Must be forwarded here or a
            // configured repo secret would silently never reach the server .env.
            'NOWPAYMENTS_API_KEY','NOWPAYMENTS_IPN_SECRET','NOWPAYMENTS_SANDBOX',
            'SMTP_HOST','SMTP_PORT','SMTP_USER','SMTP_PASS','SMTP_FROM','EMAIL_FROM_NAME','RESEND_API_KEY','RESEND_FROM','BREVO_API_KEY',
            'MAILERSEND_API_KEY','OWNER_EMAIL','HETZNER_API_KEY','HETZNER_API_TOKEN','HETZNER_HOST','HETZNER_DNS_API_KEY',
            'VAULT_MASTER_SECRET','VAULT_EMERGENCY_CODE','MASTER_CONFIG_SECRET','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID',
            'BINANCE_API_KEY','BINANCE_SECRET','COINBASE_API_KEY','COINBASE_SECRET','KRAKEN_API_KEY','KRAKEN_SECRET',
            'BYBIT_API_KEY','BYBIT_SECRET','OKX_API_KEY','OKX_SECRET','OKX_PASSWORD',
            // DeepSeek advisory/execute loop knobs — forwarded to .env via
            // create-env.sh so the systemd unit installed below sees them on
            // every deploy. All default-OFF: setting them as repo secrets is
            // the explicit operator opt-in for full-power mode (PR #547/#548).
            'DEEPSEEK_LOOP_ENABLED','DEEPSEEK_LOOP_EXECUTE','DEEPSEEK_LOOP_ADMIN_TOKEN',
            'DEEPSEEK_LOOP_INTERVAL_MS','DEEPSEEK_LOOP_BACKEND_URL',
            'DEEPSEEK_AUTO_APPLY'
          ];
          const out = [];
          for (const key of allow) {
            const value = secrets[key];
            if (!value) continue;
            const delimiter = `EOF_${key}_${Math.random().toString(36).slice(2)}`;
            out.push(`${key}<<${delimiter}\n${value}\n${delimiter}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, out.join('\n') + (out.length ? '\n' : ''));
          console.log(`Exported ${out.length} configured optional secrets for create-env.sh`);
          NODE

      - name: ⚙️ Generate .env with configured secrets
        run: |
          bash UNICORN_FINAL/scripts/create-env.sh UNICORN_FINAL

      - name: 🔐 Ensure SSH access (unicorn secrets module auto-bootstrap)
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST:            ${{ secrets.HETZNER_HOST }}
          HETZNER_DEPLOY_PORT:     ${{ secrets.HETZNER_DEPLOY_PORT || '22' }}
          HETZNER_DEPLOY_USER:     ${{ secrets.HETZNER_DEPLOY_USER || 'root' }}
        run: |
          # Folosește modulul unicorn de secrets pentru a garanta că key-auth
          # funcționează înainte de rsync/ssh-agent. Workflow-ul forward-only
          # folosește SSH key auth; parola rămâne opțională și nu este cerută aici.
          chmod +x UNICORN_FINAL/scripts/ensure-ssh-access.sh
          bash UNICORN_FINAL/scripts/ensure-ssh-access.sh

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: 🧷 Freshness + anti-downgrade guard
        run: |
          git fetch origin main --quiet
          LATEST_SHA=$(git rev-parse origin/main)
          echo "Latest origin/main commit: $LATEST_SHA"
          echo "Candidate commit: $GITHUB_SHA"
          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "❌ Refuz deploy stale: acest workflow nu mai este ultimul commit de pe main."
            echo "   Candidate=$GITHUB_SHA"
            echo "   Latest=$LATEST_SHA"
            exit 1
          fi

          DEPLOYED_SHA=$(ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
            "cat /var/www/unicorn/UNICORN_FINAL/.deployed-commit 2>/dev/null || true" | tr -d '[:space:]')
          echo "Server deployed commit: ${DEPLOYED_SHA:-none}"
          if [ -n "$DEPLOYED_SHA" ] && git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            if ! git merge-base --is-ancestor "$DEPLOYED_SHA" "$GITHUB_SHA"; then
              echo "❌ Refuz deploy: candidate-ul nu conține commitul deja deployat pe server (posibil downgrade/rollback)."
              exit 1
            fi
          fi

      - name: 🧹 Pre-deploy disk hygiene (forward-only, never touches current symlink)
        # Forward-only safety: prune old release dirs and runtime caches so
        # ENOSPC cannot block a deploy. Keeps the last 3 release dirs plus
        # whatever DEPLOY_LINK currently points at. Never touches data/, db/,
        # logs/, backups/. Idempotent.
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -se <<'REMOTE'
            set -e
            RELEASE_ROOT="/var/www/unicorn/releases"
            DEPLOY_LINK="/var/www/unicorn/UNICORN_FINAL"
            CURRENT_TARGET="$(readlink -f "$DEPLOY_LINK" 2>/dev/null || true)"
            echo "Current symlink target: ${CURRENT_TARGET:-none}"
            echo "Disk before:"; df -h /var/www | tail -1
            if [ -d "$RELEASE_ROOT" ]; then
              # Sort by mtime descending, keep newest 3, drop the rest
              # while also never deleting the dir backing the current symlink.
              cd "$RELEASE_ROOT"
              ls -1dt */ 2>/dev/null | tail -n +4 | while read -r d; do
                FULL="$RELEASE_ROOT/${d%/}"
                if [ "$FULL" = "$CURRENT_TARGET" ]; then
                  echo "  keep (live): $d"
                  continue
                fi
                echo "  prune: $d"
                rm -rf -- "$FULL"
              done
            fi
            # Best-effort cache pruning (never fatal)
            npm cache clean --force >/dev/null 2>&1 || true
            rm -rf /root/.npm/_cacache 2>/dev/null || true
            journalctl --vacuum-size=200M >/dev/null 2>&1 || true
            apt-get clean >/dev/null 2>&1 || true
            echo "Disk after:"; df -h /var/www | tail -1
          REMOTE

      - name: 📦 Deploy to Server
        run: |
          RELEASE_ID="${{ github.sha }}-$(date +%s)"
          RELEASE_ROOT="/var/www/unicorn/releases"
          RELEASE_PATH="$RELEASE_ROOT/$RELEASE_ID"
          DEPLOY_LINK="/var/www/unicorn/UNICORN_FINAL"

          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} "mkdir -p $RELEASE_ROOT && mkdir -p $RELEASE_PATH"
          # ZAC e serviciu de primă clasă (misiunea autonomiei) — NU se mai
          # dezactivează la deploy; e repornit după switch ca să ia codul nou.
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
            "systemctl disable --now unicorn-rescue-backend.service 2>/dev/null || true; systemctl reset-failed unicorn-rescue-backend.service 2>/dev/null || true; pm2 delete unicorn-guardian 2>/dev/null || true; pm2 save --force 2>/dev/null || true"
          rsync -avz --no-times --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='/.env*' \
            --exclude='/logs' \
            --exclude='/backups' \
            --exclude='/snapshots' \
            --exclude='/.archive' \
            --exclude='UNICORN_FINAL/node_modules' \
            --exclude='UNICORN_FINAL/data' \
            --exclude='UNICORN_FINAL/db' \
            --exclude='UNICORN_FINAL/backups' \
            --exclude='UNICORN_FINAL/snapshots' \
            --exclude='UNICORN_FINAL/logs' \
            --exclude='UNICORN_FINAL/.archive' \
            --exclude='UNICORN_FINAL/.unicorn-backups' \
            --exclude='UNICORN_FINAL/generated' \
            --exclude='UNICORN_FINAL/public' \
            --exclude='UNICORN_FINAL/*.log' \
            --exclude='UNICORN_FINAL/.DS_Store' \
            --exclude='UNICORN_FINAL/._*' \
            --exclude='*.zip' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.HETZNER_HOST }}:$RELEASE_PATH/

          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
            "set -euo pipefail; chmod +x '$RELEASE_PATH/UNICORN_FINAL/scripts/'*.sh '$RELEASE_PATH/UNICORN_FINAL/scripts/'*.js 2>/dev/null || true; GITHUB_SHA='${{ github.sha }}' PUBLIC_URL='https://zeusai.pro' bash '$RELEASE_PATH/UNICORN_FINAL/scripts/deploy-atomic-forward.sh' '$RELEASE_PATH/UNICORN_FINAL' '$DEPLOY_LINK'"

      - name: 🔬 Verify rsync replicated source
        # Catch silent rsync failures: pick a few canonical files from the
        # repo and confirm the deployed copy has the exact same SHA-256.
        run: |
          set -e
          for rel in UNICORN_FINAL/backend/index.js UNICORN_FINAL/package.json; do
            LOCAL_HASH=$(sha256sum "$rel" | awk '{print $1}')
            REMOTE_HASH=$(ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
              "sha256sum /var/www/unicorn/$rel 2>/dev/null | awk '{print \$1}'" || true)
            echo "$rel  local=$LOCAL_HASH  remote=$REMOTE_HASH"
            if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
              echo "❌ Deploy mismatch for $rel — rsync did not replicate the file."
              exit 1
            fi
          done
          echo "✅ rsync replication verified."

      - name: 🏷️ Stamp build SHA on server (.env + .build-sha)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -s << 'SSHEOF'
          set -uo pipefail
          SHA=$(cat /var/www/unicorn/UNICORN_FINAL/.deployed-commit 2>/dev/null | head -c 40 | tr -d '[:space:]')
          if [ -z "$SHA" ]; then echo "⚠️  .deployed-commit vazio — skip stamp"; exit 0; fi
          ENV_FILE=/var/www/unicorn/UNICORN_FINAL/.env
          # Inject or update ZEUS_BUILD_SHA + SW_VERSION in the .env file so
          # PM2 --update-env picks them up on next restart without needing
          # to re-run create-env.sh (which requires secrets that live in CI).
          if [ -f "$ENV_FILE" ]; then
            sed -i "/^ZEUS_BUILD_SHA=/d; /^SW_VERSION=/d" "$ENV_FILE"
          fi
          echo "ZEUS_BUILD_SHA=$SHA" >> "$ENV_FILE"
          echo "SW_VERSION=$SHA" >> "$ENV_FILE"
          # ── Idempotent baseline keys (forward-only) ─────────────────────
          # Some health-check scripts on the box scan .env for canonical keys
          # (PORT, NODE_ENV) and warn when they are missing. The runtime is
          # unaffected (ecosystem.config.js already exports PORT=3000), but
          # we keep .env self-describing so any external auditor sees green.
          ensure_kv() {
            local key="$1" val="$2"
            if [ -f "$ENV_FILE" ] && grep -qE "^${key}=" "$ENV_FILE"; then
              return 0
            fi
            echo "${key}=${val}" >> "$ENV_FILE"
            echo "  + stamped ${key}=${val}"
          }
          ensure_kv PORT 3000
          ensure_kv NODE_ENV production
          ensure_kv BIND_HOST 127.0.0.1
          chmod 600 "$ENV_FILE" 2>/dev/null || true
          echo "✅ BUILD SHA $SHA stampat în .env (PORT/NODE_ENV/BIND_HOST verificate)"
          SSHEOF

      - name: 🩺 Post-promote topology lean (no server-doctor restart)
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -s << 'SSHEOF'
          # Atomic deploy already canary-gated + promoted. Do NOT run
          # server-doctor.sh here — it historically did `pm2 delete all` and
          # defeated the just-promoted topology (and opened a window for rescue).
          set -uo pipefail
          DEPLOY_PATH=/var/www/unicorn/UNICORN_FINAL
          DOMAIN=zeusai.pro
          export ZEUS_BUILD_SHA="$(cat /var/www/unicorn/UNICORN_FINAL/.deployed-commit 2>/dev/null | head -c 40 | tr -d '[:space:]')"
          export SW_VERSION="$ZEUS_BUILD_SHA"
          find "$DEPLOY_PATH" -name "*.sh" -type f -exec chmod +x {} \; 2>/dev/null || true
          export UNICORN_GUARDIAN=0
          systemctl reset-failed zac.service 2>/dev/null || true
          systemctl try-restart zac.service 2>/dev/null || true
          systemctl disable --now unicorn-rescue-backend.service 2>/dev/null || true
          systemctl mask unicorn-rescue-backend.service 2>/dev/null || true
          systemctl reset-failed unicorn-rescue-backend.service 2>/dev/null || true
          pkill -f 'rescue-backend\.js' 2>/dev/null || true
          pm2 delete unicorn-guardian autoscaler unicorn-live-sync 2>/dev/null || true
          # If somehow rescue stole the name, restore canonical backend only.
          if pm2 jlist 2>/dev/null | grep -q 'rescue-backend\.js'; then
            echo "[deploy] purging rescue-backend from PM2"
            pm2 delete unicorn-backend 2>/dev/null || true
            cd "$DEPLOY_PATH"
            env QIS_AUTO_HEAL_ENABLED=false BIND_HOST=127.0.0.1 \
              pm2 start ecosystem.config.js --only unicorn-backend --update-env || true
          fi
          DUP_SITE_IDS=$(pm2 jlist 2>/dev/null | python3 -c 'import json,sys; ids=[str(p.get("pm_id")) for p in json.load(sys.stdin) if p.get("name")=="unicorn-site"]; print(" ".join(ids[1:]))' 2>/dev/null || true)
          if [ -n "$DUP_SITE_IDS" ]; then pm2 delete $DUP_SITE_IDS 2>/dev/null || true; fi
          pm2 save --force 2>/dev/null || true
          # Nginx/SSL hygiene (idempotent) — NO second full PM2 wipe.
          #   - preserves certbot SSL blocks if already present
          #   - reinstalls SSL blocks if cert exists but blocks were wiped (recovery)
          #   - obtains new cert on fresh install
          ADMIN_EMAIL="${SMTP_USER:-admin@zeusai.pro}"
          bash "$DEPLOY_PATH/scripts/setup-ssl.sh" "$DOMAIN" "$ADMIN_EMAIL" "$DEPLOY_PATH" || true
          # Garantează că nginx rutează /api/invoice/* și /api/alerts/* către backend:3000
          # (idempotent — dacă blocurile sunt deja injectate, scriptul iese fără să modifice).
          bash "$DEPLOY_PATH/scripts/ensure-btc-routes.sh" "$DOMAIN" || true
          # Patch nginx pentru public-discovery (idempotent): drop snippet în
          # /etc/nginx/snippets/ și injectează `include` în server-blocurile
          # zeusai.pro (HTTP+HTTPS) ca să iasă /.well-known/*, /humans.txt,
          # /agents.json, /offline.html de sub regula default `location ~ /\.`
          # care altfel returnează 403 la nginx-level. Restoră backup la
          # validation failure. Pe sisteme cu SSL configurat, server-doctor.sh
          # nu suprascrie /etc/nginx/sites-available/unicorn pentru a nu sparge
          # certbot — patcher-ul ăsta este complementul sigur.
          if command -v python3 >/dev/null 2>&1; then
            # Clean old backups accidentally left inside sites-enabled. nginx
            # includes every file there; *.bak.* can duplicate limit_req_zone
            # and make `nginx -t` fail even when the live config is correct.
            mkdir -p /var/backups/zeus-nginx-public-discovery
            find /etc/nginx/sites-enabled -maxdepth 1 -type f -name '*.bak.*' \
              -exec mv -f {} /var/backups/zeus-nginx-public-discovery/ \; 2>/dev/null || true
            # Some legacy/certbot-generated configs can leave more than one
            # `listen 80 default_server;` across enabled vhosts. nginx keeps
            # serving the last loaded config, but every future `nginx -t`/reload
            # fails. We do not need zeusai.conf to be the default vhost; remove
            # only the default_server flag and leave the listener/domain intact.
            for CONF in /etc/nginx/sites-enabled/* /etc/nginx/sites-available/unicorn; do
              [ -f "$CONF" ] || continue
              sed -i \
                -e 's/listen 80 default_server;/listen 80;/g' \
                -e 's/listen \[::\]:80 default_server;/listen [::]:80;/g' \
                "$CONF" 2>/dev/null || true
            done
            # Patch every active sites-enabled file that owns a server_name for our
            # domain. Active vhost is typically /etc/nginx/sites-enabled/zeusai.conf
            # (with HTTP+HTTPS blocks); sites-available/unicorn is also patched as a
            # belt-and-braces fallback in case the active symlink ever flips.
            for SITE in /etc/nginx/sites-enabled/zeusai.conf /etc/nginx/sites-enabled/unicorn /etc/nginx/sites-available/unicorn; do
              [ -f "$SITE" ] || continue
              # Resolve symlinks → patch the underlying real file once.
              REAL=$(readlink -f "$SITE")
              echo "[nginx-patch] target site → $SITE (real: $REAL)"
              python3 "$DEPLOY_PATH/scripts/nginx-patch-public-discovery.py" \
                --snippet "$DEPLOY_PATH/scripts/nginx-public-discovery.snippet.conf" \
                --site "$REAL" \
                --target /etc/nginx/snippets/zeus-public-discovery.conf \
                --domain "$DOMAIN" || \
              echo "[nginx-patch] $REAL — patch a eșuat (continuă)"
              # ZEUS-PERF: ensure /assets/ /icons/ /manifest.json bypass the
              # catch-all `add_header Cache-Control "no-cache"` so PageSpeed sees
              # immutable cacheable assets. Idempotent; --no-reload here because
              # the public-discovery patcher already handles the reload below.
              python3 "$DEPLOY_PATH/scripts/nginx-patch-asset-cache.py" \
                --site "$REAL" --no-reload || \
              echo "[nginx-patch-asset-cache] $REAL — patch a eșuat (continuă)"
            done
            # One final reload to pick up the asset-cache injection.
            nginx -t && systemctl reload nginx || \
              echo "[nginx-patch-asset-cache] reload skipped (validation/reload failed)"
            # ZEUS-100Y: route /api/v100/* and the new /.well-known/{civilization-protocol,
            # ai-rights, earth-standard, zeus-attestation}.json files to the SITE
            # service (:3001) BEFORE the generic /api/ → :3000 catch-all and BEFORE
            # the static /.well-known/ alias. Idempotent; safe to re-run on every deploy.
            python3 "$DEPLOY_PATH/scripts/nginx-patch-100y-routes.py" || \
              echo "[nginx-patch-100y-routes] patch failed (continuing)"
            # ZEUS-PERF-100Y: route the two new performance-100y .well-known
            # JSON files (perf-budget.json, web-vitals-attestation.json) to
            # the SITE service (:3001). /api/v100/perf/* is already covered
            # by the generic /api/v100/ rule from the previous patcher.
            # Idempotent; safe to re-run on every deploy.
            python3 "$DEPLOY_PATH/scripts/nginx-patch-perf-100y-routes.py" || \
              echo "[nginx-patch-perf-100y-routes] patch failed (continuing)"
            # ZEUS-SOVEREIGN-COMMERCE: route /api/checkout/create,
            # /api/commerce/{health,price,recent-sales,reconcile},
            # /api/order/*, /api/entitlements/* and /checkout/<orderId> to
            # the SITE service (:3001) — sovereign-commerce.js lives only on
            # the site, while the default /api/ catch-all proxies to BACKEND
            # which has no implementation and would 404 the Buy flow.
            python3 "$DEPLOY_PATH/scripts/nginx-patch-sovereign-commerce-routes.py" || \
              echo "[nginx-patch-sovereign-commerce-routes] patch failed (continuing)"
            # ZEUS-DELIVERY-ROUTES: route /api/delivery/* (AI fulfillment deliverable
            # download, served by src/index.js on the SITE service :3001) so paying
            # customers can fetch their generated artifact publicly. Idempotent.
            python3 "$DEPLOY_PATH/scripts/nginx-patch-delivery-routes.py" || \
              echo "[nginx-patch-delivery-routes] patch failed (continuing)"
            # ZEUS-ATTESTATION: route /api/attestation/{publickey,verify-html}
            # to the SITE service (:3001) — implementations live in
            # UNICORN_FINAL/src/index.js. Idempotent.
            python3 "$DEPLOY_PATH/scripts/nginx-patch-attestation-routes.py" || \
              echo "[nginx-patch-attestation-routes] patch failed (continuing)"
            # ZEUS-NEVER-502: install the static maintenance fallback so that
            # when both unicorn-site:3001 and unicorn-backend:3000 are down
            # (mid pm2 reload, OOM, post-rsync race) nginx serves a friendly
            # auto-refreshing HTML page from /var/www/maintenance/index.html
            # instead of a bare 502 Bad Gateway. Fully idempotent.
            bash "$DEPLOY_PATH/scripts/install-maintenance-page.sh" \
                 "$DEPLOY_PATH" "$DOMAIN" || \
              echo "[install-maintenance-page] step failed (continuing)"
          else
            echo "[nginx-patch] python3 indisponibil pe host — sărit (instalează-l ca să activezi /.well-known/*)"
          fi
          # HTTPS recovery: dacă portul 443 nu ascultă după setup-ssl.sh, forțează certbot reinstall
          echo "--- Verificare port 443 post-SSL ---"
          if ! ss -tlnp 2>/dev/null | grep -q ':443'; then
            echo "⚠️  Port 443 inactiv — forțez certbot reinstall nginx SSL..."
            certbot --nginx -d "${DOMAIN}" \
              --non-interactive --agree-tos --email "${ADMIN_EMAIL}" \
              --redirect --keep-until-expiring 2>&1 | tail -20 || \
            certbot --nginx -d "${DOMAIN}" \
              --non-interactive --agree-tos --email "admin@${DOMAIN}" \
              --keep-until-expiring 2>&1 | tail -20 || true
            systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true
            if ss -tlnp 2>/dev/null | grep -q ':443'; then
              echo "✅ Port 443 activ după certbot reinstall"
            else
              echo "⚠️  Port 443 tot inactiv — verificați DNS și certbot: certbot certificates"
            fi
          else
            echo "✅ Port 443 activ"
          fi
          # Persist PM2 process list for systemd resurrection at boot
          pm2 save --force 2>/dev/null || true
          echo "✅ Deploy complet: $(pm2 list 2>/dev/null | grep -c online || echo '?') procese PM2 online"
          SSHEOF

      - name: 🧠 Install + start DeepSeek advisory/execute loop (default-OFF)
        # Idempotent installer for `deepseek-loop.service`. Replaces the
        # manual workflow_dispatch (install-deepseek-loop.yml) for the
        # happy path: every successful deploy copies the unit file, runs
        # daemon-reload, and (when DEEPSEEK_LOOP_ENABLED=1 has been written
        # to /var/www/unicorn/UNICORN_FINAL/.env via CI secrets) calls
        # `systemctl enable --now`.
        #
        # Safety envelope preserved end-to-end:
        #   * Without DEEPSEEK_LOOP_ENABLED=1 the script exits 0 → with
        #     Restart=on-failure systemd does NOT restart it; the unit
        #     stays installed but inactive (zero CPU footprint).
        #   * Without DEEPSEEK_API_KEY the script throws missing_DEEPSEEK_API_KEY
        #     and stops (one log line per cycle).
        #   * Execute mode (POST /api/admin/deepseek/act) additionally needs
        #     DEEPSEEK_LOOP_EXECUTE=1 AND DEEPSEEK_LOOP_ADMIN_TOKEN; otherwise
        #     the loop is strictly advisory (logs only).
        #   * The backend governor re-validates every action against its
        #     hardcoded allowlist (PR #547), so even a compromised loop
        #     cannot execute anything outside the enum.
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -s << 'SSHEOF'
          set -uo pipefail
          DEPLOY_PATH=/var/www/unicorn/UNICORN_FINAL
          UNIT_SRC="$DEPLOY_PATH/scripts/deepseek-loop.service"
          UNIT_DST=/etc/systemd/system/deepseek-loop.service
          ENV_FILE="$DEPLOY_PATH/.env"

          # ── Reconcile AI keys from the persistent host store ──────────────────
          # create-env.sh runs on the GitHub runner, where the host secret store
          # does not exist, so an unset GitHub Actions secret leaves a placeholder
          # (your_deepseek_api_key_here) in .env which then overwrites the live
          # key on rsync. Here, ON THE SERVER, we force-merge any real keys from
          # /etc/zeusai/secrets/ai-keys.env (outside the release tree, survives
          # deploys) back into .env so the backend + loop always get valid keys.
          # (RO) Reconciliază cheile reale din store-ul persistent în .env după
          # fiecare deploy, astfel încât cheia DeepSeek validă să rămână activă.
          STORE=/etc/zeusai/secrets/ai-keys.env
          if [ -f "$STORE" ] && [ -f "$ENV_FILE" ]; then
            while IFS= read -r _l; do
              case "$_l" in ''|\#*) continue ;; *=*) : ;; *) continue ;; esac
              _k="${_l%%=*}"; _v="${_l#*=}"
              _v="${_v%\"}"; _v="${_v#\"}"; _v="${_v%\'}"; _v="${_v#\'}"
              [ -z "$_k" ] && continue
              [ -z "$_v" ] && continue
              grep -vE "^${_k}=" "$ENV_FILE" > "$ENV_FILE.tmp" 2>/dev/null || true
              printf "%s='%s'\n" "$_k" "$_v" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
            done < "$STORE"
            chmod 600 "$ENV_FILE" 2>/dev/null || true
            echo "🔐 Reconciled AI keys from $STORE into .env"
          fi

          # Reconcile PayPal + NOWPayments from durable host store (same pattern).
          # Empty GitHub Actions secrets must never disarm rails already armed on-box.
          PAY_STORE=/etc/zeusai/secrets/payment-rails.env
          [ -f "$PAY_STORE" ] || PAY_STORE=/var/www/unicorn/shared/payment-rails.env
          if [ -f "$PAY_STORE" ] && [ -f "$ENV_FILE" ]; then
            while IFS= read -r _l; do
              case "$_l" in ''|\#*) continue ;; *=*) : ;; *) continue ;; esac
              _k="${_l%%=*}"; _v="${_l#*=}"
              _v="${_v%\"}"; _v="${_v#\"}"; _v="${_v%\'}"; _v="${_v#\'}"
              [ -z "$_k" ] && continue
              [ -z "$_v" ] && continue
              grep -vE "^${_k}=" "$ENV_FILE" > "$ENV_FILE.tmp" 2>/dev/null || true
              printf "%s=%s\n" "$_k" "$_v" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
            done < "$PAY_STORE"
            chmod 600 "$ENV_FILE" 2>/dev/null || true
            if [ -f /var/www/unicorn/shared/.env ]; then
              while IFS= read -r _l; do
                case "$_l" in ''|\#*) continue ;; *=*) : ;; *) continue ;; esac
                _k="${_l%%=*}"; _v="${_l#*=}"
                _v="${_v%\"}"; _v="${_v#\"}"; _v="${_v%\'}"; _v="${_v#\'}"
                [ -z "$_k" ] && continue
                [ -z "$_v" ] && continue
                grep -vE "^${_k}=" /var/www/unicorn/shared/.env > /var/www/unicorn/shared/.env.tmp 2>/dev/null || true
                printf "%s=%s\n" "$_k" "$_v" >> /var/www/unicorn/shared/.env.tmp
                mv /var/www/unicorn/shared/.env.tmp /var/www/unicorn/shared/.env
              done < "$PAY_STORE"
              chmod 600 /var/www/unicorn/shared/.env 2>/dev/null || true
            fi
            echo "🔐 Reconciled payment rails from $PAY_STORE into .env"
          fi

          if [ ! -f "$UNIT_SRC" ]; then
            echo "⚠️  $UNIT_SRC missing — skipping DeepSeek loop install"
            exit 0
          fi

          # Copy the unit file only if it differs (avoids needless daemon-reload).
          # `cmp -s` returns 0 when files are identical.
          if ! cmp -s "$UNIT_SRC" "$UNIT_DST" 2>/dev/null; then
            install -m 0644 "$UNIT_SRC" "$UNIT_DST"
            systemctl daemon-reload
            echo "✅ deepseek-loop.service unit file updated"
          else
            echo "ℹ️  deepseek-loop.service unit file unchanged"
          fi

          # Ensure the runtime log directory exists (ReadWritePaths target).
          mkdir -p "$DEPLOY_PATH/data/logs"

          # Decide whether to enable+start. The loop is default-OFF and only
          # runs when the operator has opted in by setting DEEPSEEK_LOOP_ENABLED=1
          # as a GitHub Actions repository secret (which create-env.sh now
          # propagates to .env).
          LOOP_ENABLED=0
          if [ -f "$ENV_FILE" ] && grep -qE "^DEEPSEEK_LOOP_ENABLED=(['\"]?1['\"]?|['\"]?true['\"]?)[[:space:]]*$" "$ENV_FILE"; then
            LOOP_ENABLED=1
          fi

          if [ "$LOOP_ENABLED" = "1" ]; then
            # Quick prerequisite check: warn (do not fail) if API key missing.
            if ! grep -qE '^DEEPSEEK_API_KEY=' "$ENV_FILE" 2>/dev/null; then
              echo "::warning::DEEPSEEK_LOOP_ENABLED=1 but DEEPSEEK_API_KEY is missing from $ENV_FILE — the loop will log missing_DEEPSEEK_API_KEY each cycle until the key is added"
            fi
            systemctl enable --now deepseek-loop.service || true
            sleep 2
            echo "--- systemctl status (post enable --now) ---"
            systemctl is-enabled deepseek-loop.service 2>&1 || true
            systemctl is-active  deepseek-loop.service 2>&1 || true
            systemctl status deepseek-loop.service --no-pager -l 2>&1 | head -25 || true
          else
            # Honor the operator: when DEEPSEEK_LOOP_ENABLED is not set to 1
            # (either never configured, or explicitly turned back off), make
            # sure the unit will not auto-start on next boot either. This
            # keeps the on/off state symmetric with the GH secret across
            # deploys — flipping the secret OFF in CI fully deactivates the
            # loop on the next push instead of leaving a re-enable-on-reboot
            # surprise behind. `disable` is non-fatal when already disabled.
            systemctl disable deepseek-loop.service 2>/dev/null || true
            systemctl stop    deepseek-loop.service 2>/dev/null || true
            echo "ℹ️  DEEPSEEK_LOOP_ENABLED not set to 1 in $ENV_FILE — loop unit installed but disabled+stopped"
          fi
          SSHEOF

      - name: 🤖 Install autonomous health/payment bots
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -s << 'SSHEOF'
          set -uo pipefail
          DEPLOY_PATH=/var/www/unicorn/UNICORN_FINAL
          mkdir -p /usr/local/bin /var/lib/unicorn /var/log /etc/cron.d /etc/logrotate.d /opt/unicorn
          install -m 0755 "$DEPLOY_PATH/scripts/unicorn-health-bot.sh" /usr/local/bin/unicorn-health-bot.sh
          install -m 0755 "$DEPLOY_PATH/scripts/unicorn-payment-monitor.sh" /usr/local/bin/unicorn-payment-monitor.sh
          # SINGLE-HEALER CONTRACT (enforced 2026-05-29 — anti restart-storm).
          # Only `autoheal-min` may restart PM2: it has threshold(3)+cooldown(600s)+
          # disable-flag. Running multiple uncoordinated restarters (health-bot 5-min
          # restart loop, safe-watchdog, healer.timer, zeusai-autonomy, deepseek-autonomy)
          # caused a 41-restarts-in-8-min storm. Those are NEVER reinstalled here and are
          # actively purged below so a redeploy can never resurrect the storm.
          # Contract cu un singur healer — doar autoheal-min poate reporni PM2.
          install -m 0755 "$DEPLOY_PATH/scripts/autoheal-min.sh" /usr/local/bin/autoheal-min.sh
          install -m 0755 "$DEPLOY_PATH/scripts/alignment-monitor.sh" /usr/local/bin/unicorn-alignment-monitor.sh
          install -m 0755 "$DEPLOY_PATH/scripts/shared-data-retention.sh" /usr/local/bin/unicorn-shared-data-retention.sh
          chmod +x "$DEPLOY_PATH/scripts/unicorn-payment-monitor.js" 2>/dev/null || true
          # Purge any legacy aggressive restarters left on the box (idempotent).
          rm -f /etc/cron.d/unicorn-safe-watchdog /etc/cron.d/deepseek-autonomy 2>/dev/null || true
          # Purge legacy root-crontab jobs replaced by the versioned /etc/cron.d
          # contract below. Keeping both created duplicate backups and a stale
          # alignment monitor pinned to /opt/unicorn instead of the live release.
          LEGACY_CRON=$(mktemp)
          crontab -l 2>/dev/null \
            | grep -v '/opt/unicorn/UNICORN_FINAL/scripts/alignment-monitor.sh' \
            | grep -v 'unicorn-safenet-hourly' \
            > "$LEGACY_CRON" || true
          crontab "$LEGACY_CRON" 2>/dev/null || true
          rm -f "$LEGACY_CRON"
          for U in unicorn-healer.timer unicorn-healer.service zeusai-autonomy.timer \
                   zeusai-autonomy.service unicorn_godmode_v4.timer unicorn_godmode_v4.service \
                   deepseek-unified.service; do
            systemctl disable --now "$U" 2>/dev/null || true
          done
          cat > /etc/cron.d/unicorn-health-bot <<'CRON'
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # payment-monitor = benign (no PM2 restart, revenue telemetry only).
          * * * * * root DEPLOY_PATH=/var/www/unicorn/UNICORN_FINAL UNICORN_LOCAL_URL=http://127.0.0.1:3001 /usr/local/bin/unicorn-payment-monitor.sh
          # autoheal-min = the ONLY sanctioned PM2 restarter (threshold+cooldown).
          * * * * * root /usr/local/bin/autoheal-min.sh >>/var/log/unicorn-autoheal-min.log 2>&1
          */5 * * * * root ALIGNMENT_ROOT_DIR=/var/www/unicorn/current /usr/local/bin/unicorn-alignment-monitor.sh
          17 * * * * root /usr/local/bin/unicorn-shared-data-retention.sh >>/var/log/unicorn-retention.log 2>&1
          CRON
          chmod 0644 /etc/cron.d/unicorn-health-bot
          cat > /etc/logrotate.d/unicorn-transactions <<'ROTATE'
            /var/log/unicorn-transactions.log /var/log/unicorn-health-bot.log /var/log/unicorn-autoheal-min.log /var/log/alignment-monitor.log /var/log/unicorn-retention.log /var/www/unicorn/shared/logs/*.log {
              daily
              rotate 30
              size 100M
              missingok
              notifempty
              compress
              delaycompress
              copytruncate
          }
          ROTATE
          chmod 0644 /etc/logrotate.d/unicorn-transactions
          /usr/local/bin/unicorn-payment-monitor.sh || true
          /usr/local/bin/autoheal-min.sh || true
          echo "✅ autonomous health/payment bots installed"
          SSHEOF

      - name: 🏥 Health Check
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://${{ secrets.HETZNER_HOST }}:3000/health" 2>/dev/null || true)
          echo "Health check Node.js port 3000: $STATUS"
          NGINX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://${{ secrets.HETZNER_HOST }}/health" 2>/dev/null || true)
          echo "Health check Nginx port 80: $NGINX_STATUS"
          # 301/302/308 pe :80 sunt healthy — nginx face redirect HTTP→HTTPS (comportament dorit)
          case "$NGINX_STATUS" in
            200|301|302|308) NGINX_OK=1 ;;
            *)               NGINX_OK=0 ;;
          esac
          # Verificare domeniu real (zeusai.pro) — HTTP și HTTPS
          # Notă: nu folosi || echo "000" cu %{http_code} — curl scrie deja 000 pe stdout
          # la eroare de conectare, iar || echo "000" ar adăuga un al doilea 000 → "000000"
          DOMAIN_HTTP=$(curl -sL -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://zeusai.pro/health" 2>/dev/null || true)
          echo "Health check domain HTTP zeusai.pro: $DOMAIN_HTTP"
          DOMAIN_HTTPS=$(curl -skL -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "https://zeusai.pro/health" 2>/dev/null || true)
          echo "Health check domain HTTPS zeusai.pro: $DOMAIN_HTTPS"
          if [ "$STATUS" = "200" ] && [ "$NGINX_OK" = "1" ]; then
            echo "✅ Site LIVE — Node.js și Nginx funcționează corect (Nginx=$NGINX_STATUS)"
          elif [ "$STATUS" = "200" ]; then
            echo "⚠️  Node.js OK dar Nginx NU răspunde pe port 80 (status: $NGINX_STATUS) — auto-recovery..."
            ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
              "nginx -t 2>&1 && systemctl restart nginx && echo '✅ Nginx restarted' || true; ss -tlnp | grep ':80\|:443' || true; pm2 list 2>/dev/null | tail -5 || true"
          else
            echo "⚠️  Health returned Node=$STATUS Nginx=$NGINX_STATUS — checking PM2 status..."
            ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
              "pm2 list && pm2 logs unicorn-backend unicorn-site autoscaler --lines 30 --nostream" || true
          fi
          if [ "$DOMAIN_HTTP" = "200" ] || [ "$DOMAIN_HTTPS" = "200" ]; then
            echo "✅ Domeniu zeusai.pro accesibil (HTTP=$DOMAIN_HTTP HTTPS=$DOMAIN_HTTPS)"
          else
            echo "⚠️  zeusai.pro NU răspunde (HTTP=$DOMAIN_HTTP HTTPS=$DOMAIN_HTTPS) — forțez recovery SSL remote..."
            ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} \
              "certbot certificates 2>/dev/null || true; ss -tlnp | grep ':80\|:443' || true; \
               if ! ss -tlnp | grep -q ':443'; then \
                 certbot --nginx -d zeusai.pro --non-interactive --agree-tos --email admin@zeusai.pro --redirect --keep-until-expiring 2>&1 | tail -20 || true; \
                 systemctl reload nginx 2>/dev/null || true; \
                 echo 'Post-recovery HTTPS:'; curl -sk -o /dev/null -w '%{http_code}' https://zeusai.pro/health 2>/dev/null; echo ''; \
               fi; \
               nginx -T 2>/dev/null | grep -E 'server_name|listen|ssl_certificate' | head -10 || true" || true
          fi
          # Raport final HTTPS
          if [ "$DOMAIN_HTTPS" = "200" ]; then
            echo "✅ HTTPS zeusai.pro funcțional"
          else
            echo "⚠️  HTTPS zeusai.pro: $DOMAIN_HTTPS — SSL necesită verificare manuală dacă DNS e greșit"
          fi

      - name: 🧪 Public smoke tests (api/health, api/services, api/modules, api/btc/rate)
        # Rulează scripts/smoke-tests.sh ÎN PROCES PE SERVER, contra 127.0.0.1:3000
        # (bypass nginx/SSL), pentru cele 4 endpoint-uri publice care garantează
        # că backend-ul a pornit și frontend-ul nu mai rămâne pe loading. Pasul
        # este non-fatal: deploy-ul continuă, dar în log apare un raport clar.
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} bash -s << 'SSHEOF' || echo "⚠️  smoke tests step exited non-zero (non-fatal)"
          set -uo pipefail
          DEPLOY_PATH=/var/www/unicorn/UNICORN_FINAL
          cd "$DEPLOY_PATH"
          # Așteaptă PM2 warmup pentru ca primul request să nu lovească cold-start
          sleep 5
          chmod +x scripts/smoke-tests.sh 2>/dev/null || true
          echo "--- Public smoke tests: backend-direct (127.0.0.1:3000) ---"
          BASE_URL=http://127.0.0.1:3000 SMOKE_RETRIES=8 SMOKE_SLEEP=4 \
            bash scripts/smoke-tests.sh || echo "⚠️  backend-direct smoke had failures"
          echo "--- Public smoke tests: via nginx (https://zeusai.pro) ---"
          BASE_URL=https://zeusai.pro SMOKE_RETRIES=4 SMOKE_SLEEP=3 \
            bash scripts/smoke-tests.sh || echo "⚠️  nginx-front smoke had failures (poate fi cache/SSL warmup)"
