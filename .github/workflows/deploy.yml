      - name: 🔒 Sensitive path exposure gate
        run: |
          set -euo pipefail
          failed=0
          for path in '/.env' '/%2eenv' '/%252eenv' '/.git/config' '/wp-config.php' '/package-lock.json'; do
            result=$(curl --path-as-is -sS --connect-timeout 5 --max-time 15 \
              -o /dev/null -w '%{http_code} %{content_type}' "https://zeusai.pro${path}")
            status=${result%% *}
            content_type=${result#* }
            echo "${path} -> ${status} ${content_type}"
            if [ "$status" != "404" ] || [[ "$content_type" == *text/html* ]]; then
              echo "::error::Sensitive path is exposed through the public fallback: ${path} (${result})"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

