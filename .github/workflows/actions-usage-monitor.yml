name: 📊 Actions Usage Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  actions: write
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONS_RUNS_WARN_THRESHOLD: '120'
      # Belt-and-braces net for the whole fleet of workflows: even if a job's
      # own `timeout-minutes` is misconfigured or a runner wedges below the
      # Actions layer, nothing should stay in_progress/queued forever and tie
      # up concurrency groups or runner minutes indefinitely.
      STALE_RUN_MAX_MINUTES: '180'
    steps:
      - name: 📈 Summarize last 24h workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          warn_threshold = int(os.environ.get("ACTIONS_RUNS_WARN_THRESHOLD", "120"))
          since = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=24)

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "actions-usage-monitor",
          }

          all_runs = []
          for page in range(1, 6):
              url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              runs = payload.get("workflow_runs", [])
              if not runs:
                  break
              all_runs.extend(runs)
              last_created = runs[-1].get("created_at")
              if last_created:
                  created = dt.datetime.fromisoformat(last_created.replace("Z", "+00:00"))
                  if created < since:
                      break

          last_24h = []
          for run in all_runs:
              created_at = run.get("created_at")
              if not created_at:
                  continue
              created = dt.datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if created >= since:
                  last_24h.append(run)

          counts = {}
          in_progress = 0
          completed = 0
          for run in last_24h:
              name = run.get("name") or "Unknown"
              counts[name] = counts.get(name, 0) + 1
              status = run.get("status")
              if status == "completed":
                  completed += 1
              else:
                  in_progress += 1

          total = len(last_24h)
          top = sorted(counts.items(), key=lambda kv: kv[1], reverse=True)[:20]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Actions usage (last 24h)",
              "",
              f"- Total runs: **{total}**",
              f"- Completed: **{completed}**",
              f"- In progress / queued: **{in_progress}**",
              f"- Warning threshold: **{warn_threshold}** runs / 24h",
              "",
              "| Workflow | Runs |",
              "|---|---:|",
          ]
          for name, count in top:
              lines.append(f"| {name} | {count} |")
          if not top:
              lines.append("| (none) | 0 |")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          if total > warn_threshold:
              print(f"::warning::High Actions volume: {total} runs in last 24h (> {warn_threshold})")
          else:
              print(f"Actions volume OK: {total} runs in last 24h")
          PY

      - name: 🧹 Reap stale in-progress/queued runs (safety net)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          # SWISS/1.0 — defense in depth for every workflow in this repo:
          # even if a job's own `timeout-minutes` is missing/misconfigured or
          # a runner wedges below the Actions layer, no run should be able to
          # sit in_progress/queued forever. This never touches the Hetzner
          # server directly; it only cancels GitHub-hosted Actions runs via
          # the Actions API, so it is safe to run unattended on a schedule.
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          max_minutes = int(os.environ.get("STALE_RUN_MAX_MINUTES", "180"))
          this_run_id = os.environ.get("GITHUB_RUN_ID")
          now = dt.datetime.now(dt.timezone.utc)

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "actions-usage-monitor",
          }

          reaped = []
          errors = []
          for status in ("in_progress", "queued"):
              url = f"https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
              except urllib.error.URLError as exc:
                  errors.append(f"list {status}: {exc}")
                  continue

              for run in payload.get("workflow_runs", []):
                  run_id = run.get("id")
                  # Never cancel this very monitor run.
                  if this_run_id and str(run_id) == str(this_run_id):
                      continue
                  created_at = run.get("run_started_at") or run.get("created_at")
                  if not created_at:
                      continue
                  started = dt.datetime.fromisoformat(created_at.replace("Z", "+00:00"))
                  age_minutes = (now - started).total_seconds() / 60
                  if age_minutes < max_minutes:
                      continue

                  name = run.get("name") or "Unknown"
                  cancel_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
                  cancel_req = urllib.request.Request(cancel_url, headers=headers, method="POST")
                  try:
                      with urllib.request.urlopen(cancel_req, timeout=30):
                          pass
                      reaped.append((name, run_id, round(age_minutes)))
                      print(f"::warning::Cancelled stale run '{name}' (id={run_id}, age={round(age_minutes)}m, status={status})")
                  except urllib.error.URLError as exc:
                      errors.append(f"cancel {run_id}: {exc}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              lines = ["", "## Stale run reaper", ""]
              if reaped:
                  lines.append(f"Cancelled **{len(reaped)}** run(s) stuck > {max_minutes}m:")
                  lines.append("")
                  lines.append("| Workflow | Run ID | Age (min) |")
                  lines.append("|---|---:|---:|")
                  for name, run_id, age in reaped:
                      lines.append(f"| {name} | {run_id} | {age} |")
              else:
                  lines.append(f"No stale runs found (threshold: {max_minutes}m).")
              if errors:
                  lines.append("")
                  lines.append("Errors encountered:")
                  for err in errors:
                      lines.append(f"- {err}")
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          if not reaped:
              print(f"No stale runs found (threshold: {max_minutes}m).")
          PY
