name: 🧠 Full System Audit + Optimization

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

concurrency:
  group: full-system-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            UNICORN_FINAL/package-lock.json

      - name: 🔧 Install deps
        run: |
          npm --prefix UNICORN_FINAL ci --no-audit --no-fund --loglevel=error

      - name: 🔎 Run full audit
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
        run: |
          npm --prefix UNICORN_FINAL run audit:full

      - name: ✅ Fast regression checks
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
        run: |
          npm --prefix UNICORN_FINAL run lint:syntax
          npm --prefix UNICORN_FINAL run test:health
          npm --prefix UNICORN_FINAL run test:api

      - name: 📦 Upload audit artifacts
        uses: actions/upload-artifact@v5
        with:
          name: full-system-audit-reports
          path: UNICORN_FINAL/reports/full-system-audit/
          if-no-files-found: error
