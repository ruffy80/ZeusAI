# Hetzner deploy entrypoint — reuses canonical stable deploy when secrets present
name: 🚀 Deploy Hetzner
on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  setup-optional:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_HETZNER_SETUP == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - name: Run setup-hetzner-auto (only when explicitly armed)
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          GIT_REPO_URL: ${{ secrets.GIT_REPO_URL || 'https://github.com/ruffy80/ZeusAI.git' }}
          BRANCH: main
        run: |
          set -euo pipefail
          if [ -z "${HETZNER_HOST:-}" ] || [ -z "${HETZNER_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing HETZNER_HOST / HETZNER_SSH_PRIVATE_KEY"
            exit 1
          fi
          node UNICORN_FINAL/scripts/setup-hetzner-auto.js
