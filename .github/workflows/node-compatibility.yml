name: 🧪 Node Compatibility Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'UNICORN_FINAL/src/**'
      - 'UNICORN_FINAL/backend/**'
      - 'UNICORN_FINAL/client/**'
      - 'UNICORN_FINAL/scripts/**'
      - 'UNICORN_FINAL/package.json'
      - 'UNICORN_FINAL/package-lock.json'
      - 'UNICORN_FINAL/ecosystem.config.js'
      - 'package.json'
      - 'Dockerfile'
      - 'UNICORN_FINAL/Dockerfile'
      - '.nvmrc'
      - 'UNICORN_FINAL/.nvmrc'
      - '.github/workflows/node-compatibility.yml'

concurrency:
  group: node-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Forever policy: only Active/Current LTS lines with reliable
        # better-sqlite3 prebuilds. Node 20 was removed after repeated
        # node-gyp header fetch / native rebuild flakes (not app bugs).
        # Production uses .nvmrc → lts/* (Node 22+). engines: ">=22 <26".
        node: [22, 24]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            UNICORN_FINAL/package-lock.json
            UNICORN_FINAL/client/package-lock.json

      - name: 🧰 Native build toolchain (better-sqlite3 fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3

      - name: 📦 Install backend deps
        working-directory: ./UNICORN_FINAL
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && exit 0
            echo "[compat] npm ci attempt $i failed — retrying in $((i*8))s"
            sleep $((i*8))
            rm -rf node_modules
          done
          echo "[compat] npm ci failed after 3 attempts" >&2
          exit 1

      - name: 🧾 Engine / nvm / matrix contract
        working-directory: ./UNICORN_FINAL
        env:
          EXPECT: ${{ matrix.node }}
        run: |
          set -euo pipefail
          echo "[compat] node=$(node -v) npm=$(npm -v) matrix=${EXPECT}"
          node -e 'const e=Number(process.env.EXPECT),m=Number(process.versions.node.split(".")[0]); if(m!==e){console.error("[compat] matrix/runtime mismatch",process.versions.node,"expected",e); process.exit(1);} console.log("[compat] runtime major matches matrix",m);'

      - name: 🔎 Compat Truth Preflight (CTOS — never fake Node ABI reds)
        working-directory: ./UNICORN_FINAL
        env:
          NODE_COMPAT_MATRIX: ${{ matrix.node }}
        run: |
          set -euo pipefail
          # CTOS/1.0: classify SITE_CTA / COMMERCE / NGINX / ENGINE contracts
          # BEFORE npm test so a raw-JSON CTA or QR regression never shows up
          # as "Node 22/24 compatibility failed".
          node scripts/compat-truth-preflight.js

      - name: 🔍 Lint backend + site
        working-directory: ./UNICORN_FINAL
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
        run: npm run lint

      - name: 🧪 Run tests
        working-directory: ./UNICORN_FINAL
        run: |
          set -euo pipefail
          npm test --if-present
        env:
          # Surface which Node major failed in job summaries / annotations.
          NODE_COMPAT_MATRIX: ${{ matrix.node }}
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
          ZACC_ENABLE_ESCUELA: '0'

      - name: 🏗️ Build frontend
        working-directory: ./UNICORN_FINAL/client
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            echo "[compat] client npm ci attempt $i failed — retrying"
            sleep $((i*5))
            rm -rf node_modules
            if [ "$i" = "3" ]; then exit 1; fi
          done
          CI=false npm run build
