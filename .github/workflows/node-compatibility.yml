name: 🧪 Node Compatibility Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'UNICORN_FINAL/src/**'
      - 'UNICORN_FINAL/backend/**'
      - 'UNICORN_FINAL/client/**'
      - 'UNICORN_FINAL/scripts/**'
      - 'UNICORN_FINAL/package.json'
      - 'UNICORN_FINAL/package-lock.json'
      - 'UNICORN_FINAL/ecosystem.config.js'
      - 'package.json'
      - 'Dockerfile'
      - 'UNICORN_FINAL/Dockerfile'
      - '.nvmrc'
      - 'UNICORN_FINAL/.nvmrc'
      - '.github/workflows/node-compatibility.yml'

concurrency:
  group: node-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Attempt #2+ on a SHA that is no longer the tip of the PR/branch must NOT
  # re-fail and spam "All jobs have failed" after a newer commit already fixed
  # the matrix (seen 2026-09-04: re-run of 59b12971 after 70f961bc was green).
  supersede-gate:
    name: Supersede gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_compat: ${{ steps.gate.outputs.run_compat }}
    steps:
      - name: Decide whether this Attempt should run the matrix
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ATTEMPT="${{ github.run_attempt }}"
          SHA="${{ github.sha }}"
          REF="${{ github.head_ref || github.ref_name }}"
          if [ "$ATTEMPT" = "1" ]; then
            echo "run_compat=true" >> "$GITHUB_OUTPUT"
            echo "[gate] Attempt #1 — run matrix for $SHA"
            exit 0
          fi
          TIP=""
          if command -v gh >/dev/null 2>&1; then
            TIP=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq .sha 2>/dev/null || true)
          fi
          if [ -n "$TIP" ] && [ "$TIP" != "$SHA" ]; then
            echo "::notice title=Obsolete matrix re-run skipped::Attempt #${ATTEMPT} of ${SHA:0:12} is superseded by tip ${TIP:0:12} on ${REF}. Not re-failing — open/re-run the tip SHA instead."
            echo "run_compat=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Supersede gate"
              echo "- attempt: \`${ATTEMPT}\`"
              echo "- this SHA: \`${SHA}\`"
              echo "- tip of \`${REF}\`: \`${TIP}\`"
              echo "- result: **skipped** (obsolete re-run — prevents stale red notifications)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_compat=true" >> "$GITHUB_OUTPUT"
            echo "[gate] Attempt #${ATTEMPT} still on tip ${SHA:0:12} — run matrix"
          fi

  compat:
    name: Node ${{ matrix.node }} compatibility
    needs: supersede-gate
    if: needs.supersede-gate.outputs.run_compat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Forever policy: only Active/Current LTS lines with reliable
        # better-sqlite3 prebuilds. Node 20 was removed after repeated
        # node-gyp header fetch / native rebuild flakes (not app bugs).
        # Production uses .nvmrc → lts/* (Node 22+). engines: ">=22 <26".
        node: [22, 24]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            UNICORN_FINAL/package-lock.json
            UNICORN_FINAL/client/package-lock.json

      - name: 🧰 Native build toolchain (better-sqlite3 fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3

      - name: 📦 Install backend deps
        working-directory: ./UNICORN_FINAL
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && exit 0
            echo "[compat] npm ci attempt $i failed — retrying in $((i*8))s"
            sleep $((i*8))
            rm -rf node_modules
          done
          echo "[compat] npm ci failed after 3 attempts" >&2
          exit 1

      - name: 🧾 Engine / nvm / matrix contract
        working-directory: ./UNICORN_FINAL
        env:
          EXPECT: ${{ matrix.node }}
        run: |
          set -euo pipefail
          echo "[compat] node=$(node -v) npm=$(npm -v) matrix=${EXPECT}"
          node -e 'const e=Number(process.env.EXPECT),m=Number(process.versions.node.split(".")[0]); if(m!==e){console.error("[compat] matrix/runtime mismatch",process.versions.node,"expected",e); process.exit(1);} console.log("[compat] runtime major matches matrix",m);'

      - name: 🔎 Compat Truth Preflight (CTOS — never fake Node ABI reds)
        working-directory: ./UNICORN_FINAL
        env:
          NODE_COMPAT_MATRIX: ${{ matrix.node }}
        run: |
          set -euo pipefail
          # CTOS/1.0: classify SITE_CTA / COMMERCE / NGINX / ENGINE contracts
          # BEFORE npm test so a raw-JSON CTA or QR regression never shows up
          # as "Node 22/24 compatibility failed".
          node scripts/compat-truth-preflight.js

      - name: 🔍 Lint backend + site
        working-directory: ./UNICORN_FINAL
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
        run: npm run lint

      - name: 🧪 Run tests (TTS — per-file retry on ECONNRESET)
        working-directory: ./UNICORN_FINAL
        run: |
          set -euo pipefail
          # Transient Test Shield (TTS/1.0): file-by-file with one retry on
          # fetch/ECONNRESET flakes. Real assertion failures still fail fast.
          npm run test:ci --if-present
        env:
          # Surface which Node major failed in job summaries / annotations.
          NODE_COMPAT_MATRIX: ${{ matrix.node }}
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
          ZACC_ENABLE_ESCUELA: '0'
          # NIX/1.0 — hermetic Node seal (undici/fetch timeouts) for matrix runs.
          NODE_OPTIONS: --no-deprecation --require=./backend/lib/node-immortality.js
          NIX_QUIET: '1'

      - name: 🏗️ Build frontend
        working-directory: ./UNICORN_FINAL/client
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            echo "[compat] client npm ci attempt $i failed — retrying"
            sleep $((i*5))
            rm -rf node_modules
            if [ "$i" = "3" ]; then exit 1; fi
          done
          CI=false npm run build
