name: ⚡ Compat Truth Instant Autofix

# When Node Compatibility Matrix fails (or is dispatched), instantly repair
# SITE_CTA_REGRESSION (raw /api JSON CTAs → data-live-inspect) and push the fix
# back to the PR branch so the matrix can go green without human intervention.

on:
  workflow_run:
    workflows: ["🧪 Node Compatibility Matrix"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to autofix (branch or SHA)'
        required: false
        default: ''

concurrency:
  group: compat-truth-autofix-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  instant-fix:
    name: Instant SITE_CTA autofix
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ref }}" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            echo "ref=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout failing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: UNICORN_FINAL/.nvmrc

      - name: ⚡ Run instant autofix
        id: fix
        working-directory: ./UNICORN_FINAL
        run: |
          set -euo pipefail
          node scripts/compat-truth-autofix.js | tee /tmp/autofix.log
          if git -C .. diff --quiet -- UNICORN_FINAL; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SITE_CTA repairs needed (failure was not autofixable CTA regression)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -C .. diff --stat
          fi

      - name: ✅ Re-verify CTA guard
        if: steps.fix.outputs.changed == 'true'
        working-directory: ./UNICORN_FINAL
        run: |
          set -euo pipefail
          node test/no-raw-json-cta-guard.test.js

      - name: 📤 Commit + push instant repair
        if: steps.fix.outputs.changed == 'true'
        working-directory: ./UNICORN_FINAL
        run: |
          set -euo pipefail
          git config user.name "zeusai-compat-truth[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src backend/modules
          git commit -m "fix(ctos): instant SITE_CTA autofix (raw JSON CTA → live-inspect)

          Autogenerated by Compat Truth Instant Autofix after Node Compatibility
          Matrix failure. No human intervention."
          # Push to the PR head branch (retry on race).
          for i in 1 2 3; do
            git push origin "HEAD:${{ steps.ref.outputs.ref }}" && exit 0
            sleep $((i * 4))
            git pull --rebase origin "${{ steps.ref.outputs.ref }}" || true
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Compat Truth Instant Autofix" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ steps.ref.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- changed: \`${{ steps.fix.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.fix.outputs.changed }}" = "true" ]; then
            echo "- result: **pushed autofix commit** — matrix will re-run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- result: nothing to autofix (inspect CTOS class on the failed matrix job)" >> "$GITHUB_STEP_SUMMARY"
          fi
