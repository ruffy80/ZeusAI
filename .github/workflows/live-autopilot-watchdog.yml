name: 🛰️ Live Autopilot Watchdog

on:
  workflow_run:
    workflows: ["🚀 Unicorn Stable Deploy"]
    types: [completed]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: live-autopilot-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  verify-live:
    # SWISS/1.0 — run after SUCCESSFUL Stable Deploys + schedule + manual.
    # Do NOT run on Stable Deploy failure: diagnose-and-repair.yml already
    # auto-triggers via its own workflow_run on failure. Double-dispatch was
    # stacking nuclear heals (pm2 delete all) and thrashing production.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ✅ Run live smoke checks
        id: verify
        continue-on-error: true
        run: |
          set +e
          bash scripts/live-smoke.sh
          rc_smoke=$?
          bash scripts/live-contract-check.sh
          rc_contract=$?
          set -e

          if [ "$rc_smoke" -eq 0 ] && [ "$rc_contract" -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "✅ live smoke + contract checks passed"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "❌ verification failed (smoke=$rc_smoke, contract=$rc_contract)"
          fi

      - name: 🩺 Auto-dispatch Diagnose & Repair
        id: repair
        if: ${{ steps.verify.outputs.failed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never stack repair on top of an in-flight Stable Deploy — that races
          # canary promotion and can thrash PM2 / nginx during the switch window.
          in_flight="$(gh api "repos/${REPO}/actions/workflows/deploy.yml/runs?status=in_progress&per_page=5" \
            --jq '.workflow_runs | length' 2>/dev/null || echo 0)"
          if [ "${in_flight:-0}" -gt 0 ]; then
            echo "⏭️  Stable Deploy is in progress — skipping diagnose-and-repair dispatch (anti-thrash)"
            echo "skipped_deploy_race=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SWISS/1.0 — rate-limit heal dispatches (max 1 per 25 minutes).
          # Prevents schedule ticks from nuclear-thrashing a healthy-but-flaky
          # public edge while diagnose is already running or just finished.
          recent="$(gh api "repos/${REPO}/actions/workflows/diagnose-and-repair.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.status=="in_progress" or ((now - (.created_at | fromdateiso8601)) < 1500))] | length' \
            2>/dev/null || echo 0)"
          if [ "${recent:-0}" -gt 0 ]; then
            echo "⏭️  Diagnose & Repair already in-flight or ran <25m ago — skipping dispatch (anti-thrash)"
            echo "skipped_deploy_race=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skipped_deploy_race=false" >> "$GITHUB_OUTPUT"
          # Soft-first heal by default (nuclear only if loopback is dead).
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/diagnose-and-repair.yml/dispatches" \
            -d '{"ref":"main","inputs":{"do_repair":true,"clear_kill_switches":false,"force_nuclear":false}}'
          echo "✅ diagnose-and-repair workflow dispatched (soft-first)"

      # CGP/1.0 — dispatching Diagnose & Repair is the success path for an
      # unhealthy live surface. Marking the watchdog red after a successful
      # dispatch only creates alert noise and blocks dependent green chains.
      # Fail hard only when repair could not be dispatched (API/auth error).
      - name: ✅ Soft-pass after heal dispatch (Actions stay green)
        if: ${{ steps.verify.outputs.failed == 'true' && steps.repair.outputs.skipped_deploy_race != 'true' && steps.repair.outcome == 'success' }}
        run: |
          echo "::warning::Live verification failed — Diagnose & Repair was dispatched successfully."
          echo "Watchdog soft-passes so CI stays green while heal runs (see diagnose-and-repair run)."

      - name: 🚨 Fail only when heal dispatch itself failed
        if: ${{ steps.verify.outputs.failed == 'true' && steps.repair.outputs.skipped_deploy_race != 'true' && steps.repair.outcome != 'success' && steps.repair.outcome != 'skipped' }}
        run: |
          echo "::error::Live verification failed AND Diagnose & Repair dispatch failed."
          exit 1

      - name: ℹ️ Soft-pass when verify flaked during deploy window
        if: ${{ steps.verify.outputs.failed == 'true' && steps.repair.outputs.skipped_deploy_race == 'true' }}
        run: |
          echo "Live checks flaked while Stable Deploy / recent heal was in flight; no repair dispatched."
          echo "This is an intentional soft-pass to avoid server thrash during canary promotion."
