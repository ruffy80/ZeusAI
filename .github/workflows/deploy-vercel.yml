# Optional Vercel frontend publish — production traffic remains on Hetzner (zeusai.pro)
name: ▲ Deploy Vercel (optional)
on:
  workflow_dispatch:

jobs:
  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: UNICORN_FINAL/client/package-lock.json

      - name: Build client (always — validates frontend compiles)
        working-directory: UNICORN_FINAL/client
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: |
          npm ci || npm install
          npm run build
          test -f build/index.html
          echo "✅ client build ok"

      - name: Publish to Vercel (when secrets present)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::notice::Vercel secrets not configured — build validated; Hetzner remains primary publish path."
            exit 0
          fi
          npm install -g vercel@39
          cd UNICORN_FINAL/client
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
