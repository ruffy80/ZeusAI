# Autonomous evolve + heal cadence (safe read-only by default)
name: 🧬 Autonomous evolve/heal
on:
  workflow_dispatch:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'

concurrency:
  group: unicorn-autonomous
  cancel-in-progress: false

jobs:
  autonomous:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: UNICORN_FINAL/package-lock.json

      - name: Install (UNICORN_FINAL)
        working-directory: UNICORN_FINAL
        run: |
          for i in 1 2 3; do
            npm ci && break
            sleep $((i*4))
          done

      - name: Evolve (innovation sprint — status only / safe)
        working-directory: UNICORN_FINAL
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
        run: npm run evolve

      - name: Heal (health guardian)
        working-directory: UNICORN_FINAL
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
          HEALTH_GUARDIAN_RETRIES: '4'
          HEALTH_GUARDIAN_TIMEOUT_MS: '15000'
          HEALTH_GUARDIAN_RETRY_MS: '2000'
        run: npm run heal

      - name: Continuum smoke
        working-directory: UNICORN_FINAL
        env:
          DISABLE_SELF_MUTATION: '1'
          NODE_ENV: test
          UNICORN_RUNTIME_PROFILE: stable
        run: |
          node -e "
            const cho=require('./backend/modules/continuum-harmony-os');
            const tep=require('./backend/modules/total-ecosystem-perfection-os');
            tep.start();
            const t=tep.getStatus();
            console.log('TEP', t.modulesDirCount, 'adaptive', t.adaptiveShimCount, 'engines', t.engineShimCount);
            if (!t.over200) { console.error('expected 200+ modules'); process.exit(1); }
            if (t.adaptiveShimCount < 82 || t.engineShimCount < 62) process.exit(2);
            console.log('OK');
            process.exit(0);
          "
