# zeus-security-headers.conf — production-safe HTTP security headers.
# ---------------------------------------------------------------------------
# Additive, low-risk hardening. Does NOT touch CSP, HSTS, or any existing
# location blocks — safe to `include` from a server{} block or install as a
# standalone snippet. deploy-local.sh writes this verbatim to
# /etc/nginx/snippets/zeus-security-headers.conf.
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
