# ── /.well-known/autonomy.json — TAOS/1.0 live score (backend-owned) ────────
# The backend (port 3000) serves this at ['/api/autonomy/os', '/.well-known/autonomy.json'].
# The generic `^~ /.well-known/` block routes to unicorn_site (3001) which does
# not proxy it — this exact-match location overrides that and sends it to the backend.
location = /.well-known/autonomy.json {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

