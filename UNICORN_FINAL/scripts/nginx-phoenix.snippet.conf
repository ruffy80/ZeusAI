# Phoenix Continuity OS (PCOS/1.0) — immortality + LKG commerce surfaces
# Include inside the zeusai.pro server { } block BEFORE the generic
# `location ^~ /api/` rule, e.g.:
#   include /etc/nginx/snippets/zeus-phoenix.conf;
#
# Contract: these paths ALWAYS complete an HTTP response (live brain or
# last-known-good). Never 0-byte hangs on money-critical surfaces.

location = /phoenix/live {
    proxy_pass         http://127.0.0.1:3002/phoenix/live;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    3s;
    proxy_send_timeout    3s;
}

location = /phoenix/status {
    proxy_pass         http://127.0.0.1:3002/phoenix/status;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout    3s;
}

# Money-critical: prefer phoenix (proxy+LKG) over direct brain.
location = /api/health {
    proxy_pass         http://127.0.0.1:3002/api/health;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    6s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
}

location = /api/catalog {
    proxy_pass         http://127.0.0.1:3002/api/catalog;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    8s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
}
