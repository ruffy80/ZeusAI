# Optional nginx map snippet — Edge Bond Signal (EBS/1.0)
# Install manually if you want a public maintenance hint when the signal file
# recommends it. Does NOT auto-rewrite upstreams.
#
#   include /var/www/unicorn/UNICORN_FINAL/scripts/nginx-edge-bond-snippet.conf;
#
# Signal path (written by ICP): shared data immortality/edge-bond.json
# Prefer probing /api/icp/edge-bond from an external checker rather than
# blocking all traffic on a single file read.

# Example (disabled by default — uncomment after validating):
# map $edge_bond_recommendation $zeus_edge_maintenance {
#   default 0;
#   maintenance_hint 1;
#   public_edge_degraded_while_local_green 0;
# }
